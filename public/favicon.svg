  <path d="M3,8 H8 V16 M3,24 H8 V16" fill="none" stroke="#f97316" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="8" y1="16" x2="13" y2="16" stroke="#f97316" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Right bracket: mirror -->
  <path d="M29,8 H24 V16 M29,24 H24 V16" fill="none" stroke="#f97316" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="24" y1="16" x2="19" y2="16" stroke="#f97316" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Trophy cup center -->
  <path d="M14,12 H18 V17 Q16,19 16,19 Q16,19 14,17 Z" fill="#f97316"/>
  <line x1="14.5" y1="19" x2="17.5" y2="19" stroke="#f97316" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="16" y1="19" x2="16" y2="21" stroke="#f97316" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="14" y1="21" x2="18" y2="21" stroke="#f97316" stroke-width="1.8" stroke-linecap="round"/>
</svg>
